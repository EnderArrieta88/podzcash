name: Monitor de producción

on:
  schedule:
    # Cada 15 minutos. GitHub puede retrasar tareas programadas.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: production-healthcheck
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comprobar /api/health
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if response=$(curl -fsS --max-time 20 https://podzcash.online/api/health); then
              echo "$response"
              echo "$response" | jq -e '.ok == true' > /dev/null
              exit 0
            fi
            echo "Intento $attempt falló; reintentando en 10 s."
            sleep 10
          done

          echo "::error::La aplicación no responde en /api/health."
          exit 1

      - name: Comprobar inicio
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://podzcash.online/ > /dev/null
