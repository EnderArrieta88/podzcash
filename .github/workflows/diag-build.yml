name: Diagnostico build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production

    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Leer log del servidor
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -uo pipefail

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          get "$REMOTE_DIR/stderr.log" -o stderr.log
          bye
          EOF

          if [ ! -f stderr.log ]; then
            echo "No se pudo descargar stderr.log"
            exit 0
          fi

          echo "=== tamaño: $(wc -c < stderr.log) bytes ==="
          echo "=== paquetes no encontrados ==="
          grep -oE "Cannot find (module|package) '[^']+'" stderr.log | sort -u | head -n 20 || true
          echo "=== ultimas lineas sin ruido de fork ==="
          grep -vE "fork: (retry: )?Resource temporarily unavailable" stderr.log \
            | tail -n 150 \
            | sed -E 's/[A-Za-z0-9+/=_-]{50,}/[redactado]/g'
