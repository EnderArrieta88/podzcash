name: Diagnostico build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production

    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Listar alias y mover log
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -uo pipefail

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          mv "$REMOTE_DIR/stderr.log" "$REMOTE_DIR/tmp/diag.txt"
          bye
          EOF
