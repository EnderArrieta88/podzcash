name: Deploy a producción

# Solo manual: se dispara desde la pestaña Actions → Run workflow.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribí "deploy" para confirmar'
        required: true
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Compilar
        run: npm run build
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Armar el bundle
        run: |
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then cp -a public deploy/public; fi
          # Archivos del repo que no se usan en runtime y pueden colisionar
          # con rutas del sitio.
          rm -rf deploy/design deploy/AGENTS.md deploy/DESIGN.md deploy/README.md
          echo "archivos estáticos: $(find deploy/.next/static -type f | wc -l)"
          du -sh deploy

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Borra restos de versiones anteriores que no deben quedar en el doc root.
      - name: Limpiar carpetas obsoletas
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set +e
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          rm -rf "$REMOTE_DIR/design"
          bye
          EOF
          true

      # Código y dependencias: solo lo que cambió. Nunca borra del servidor.
      - name: Subir código
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 3
          set mirror:parallel-transfer-count 2
          mirror -R --only-newer --no-perms --verbose \
            --exclude-glob .next \
            --exclude-glob .next/* \
            --exclude-glob .env \
            --exclude-glob .htaccess \
            --exclude-glob stderr.log \
            --exclude-glob prisma/dev.db \
            --exclude-glob prisma/dev.db-* \
            --exclude-glob .media \
            --exclude-glob .media/* \
            --exclude-glob .data \
            --exclude-glob .data/* \
            --exclude-glob tmp \
            --exclude-glob tmp/* \
            ./deploy/ "$REMOTE_DIR"
          bye
          EOF

      # El build se sube completo (sin --only-newer): un chunk olvidado deja
      # la página sin hidratar. Son ~40 MB y garantiza consistencia.
      - name: Subir build (.next)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 3
          set mirror:parallel-transfer-count 2
          mirror -R --no-perms --verbose ./deploy/.next "$REMOTE_DIR/.next"
          bye
          EOF

      # Compara la cantidad de archivos estáticos locales y remotos.
      - name: Verificar integridad del build
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          local_count=$(find deploy/.next/static -type f | wc -l)
          remote_count=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF | wc -l
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          find "$REMOTE_DIR/.next/static"
          bye
          EOF
          )
          echo "estáticos locales: $local_count / remotos: $remote_count"
          if [ "$remote_count" -lt "$local_count" ]; then
            echo "::error::Faltan archivos estáticos en el servidor ($local_count locales vs $remote_count remotos)."
            exit 1
          fi

      # Passenger reinicia la app cuando cambia tmp/restart.txt.
      - name: Reiniciar la aplicación
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "restart $(date -u +%s)" > restart.txt
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          put restart.txt -o "$REMOTE_DIR/tmp/restart.txt"
          bye
          EOF

      - name: Verificar el sitio
        run: |
          # Passenger y el sistema de archivos del hosting tardan en reflejar
          # el build nuevo: se espera y se reintenta con paciencia.
          for i in $(seq 1 30); do
            if curl -fsS https://podzcash.online/api/health > /dev/null 2>&1; then break; fi
            sleep 3
          done
          sleep 30

          curl -fsS https://podzcash.online/api/health

          # Si el destino FTP fuera el directorio público, estos archivos
          # estarían accesibles: se aborta el deploy con alerta.
          code=$(curl -s -o /dev/null -w '%{http_code}' https://podzcash.online/server.js)
          if [ "$code" != "404" ]; then
            echo "::error::Los archivos internos están expuestos ($code). Revisá FTP_SERVER_DIR."
            exit 1
          fi

          # Cada archivo estático del build debe servirse por HTTP. Un chunk
          # faltante deja la página sin hidratar.
          missing=0
          while IFS= read -r file; do
            url="${file#deploy}"
            status="000"
            for attempt in $(seq 1 10); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "https://podzcash.online$url")
              [ "$status" = "200" ] && break
              sleep 10
            done
            if [ "$status" != "200" ]; then
              echo "::error::Falta $url ($status)"
              missing=$((missing + 1))
            fi
          done < <(find deploy/.next/static -type f)
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing archivos estáticos no se sirven."
            exit 1
          fi

          echo "Sitio verificado ✓"
