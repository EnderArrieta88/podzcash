name: Deploy a producción

# Solo manual: se dispara desde la pestaña Actions → Run workflow.
# Además, solo se permite desde main y pasa por el entorno "production",
# que exige la aprobación del mantenedor antes de ejecutar los pasos.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe "deploy" para confirmar'
        required: true
        default: ""

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production
      url: https://podzcash.online

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Compilar
        run: npm run build
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Armar el bundle
        run: |
          set -euo pipefail
          mkdir -p deploy/.next
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          if [ -d public ]; then cp -a public deploy/public; fi
          # Vigía de despliegues: el cron del hosting lo ejecuta cada minuto.
          mkdir -p deploy/scripts
          cp scripts/deploy-watch.sh deploy/scripts/deploy-watch.sh
          # Next crea alias de paquetes externos como enlaces simbólicos
          # dentro de .next/node_modules. FTP no puede subirlos, así que los
          # materializamos como carpetas reales antes de transferir.
          if [ -d deploy/.next/node_modules ]; then
            aliases_dir=$(mktemp -d)
            cp -aL deploy/.next/node_modules/. "$aliases_dir/"
            rm -rf deploy/.next/node_modules
            mv "$aliases_dir" deploy/.next/node_modules
            echo "alias materializados: $(find deploy/.next/node_modules -mindepth 1 -maxdepth 2 -type d | wc -l)"
          fi
          # Archivos del repo que no se usan en runtime y pueden colisionar
          # con rutas del sitio.
          rm -rf deploy/design deploy/AGENTS.md deploy/DESIGN.md deploy/README.md
          echo "archivos estáticos: $(find deploy/.next/static -type f | wc -l)"
          echo "archivos de servidor: $(find deploy/.next/server -type f | wc -l)"
          du -sh deploy

          # No se toca el servidor si el bundle local está incompleto o
          # conserva enlaces simbólicos que el FTP no puede transferir.
          test -f deploy/server.js
          test -f deploy/.next/BUILD_ID
          test -d deploy/.next/server
          test -d deploy/node_modules/next
          test -f deploy/node_modules/next/dist/server/next-server.js

          symlinks=$(find deploy -type l | wc -l)
          if [ "$symlinks" -ne 0 ]; then
            echo "::error::Quedan $symlinks enlaces simbólicos en el bundle."
            find deploy -type l | head -n 20
            exit 1
          fi

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Borra restos de versiones anteriores que no deben quedar en el doc root.
      - name: Limpiar carpetas obsoletas
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set +e
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          rm -rf "$REMOTE_DIR/design"
          rm -rf "$REMOTE_DIR/node_modules/ffmpeg-static"
          bye
          EOF
          true

      # Código y dependencias: se sube completo para que el servidor tenga
      # exactamente las mismas versiones que el build. Nunca borra del servidor
      # (las exclusiones protegen datos y configuración).
      - name: Subir código
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 3
          set mirror:parallel-transfer-count 2
          mirror -R --no-perms --verbose \
            --exclude-glob .next \
            --exclude-glob .next/* \
            --exclude-glob .env \
            --exclude-glob .htaccess \
            --exclude-glob stderr.log \
            --exclude-glob prisma/dev.db \
            --exclude-glob prisma/dev.db-* \
            --exclude-glob .media \
            --exclude-glob .media/* \
            --exclude-glob .data \
            --exclude-glob .data/* \
            --exclude-glob tmp \
            --exclude-glob tmp/* \
            ./deploy/ "$REMOTE_DIR"
          bye
          EOF

      # El build se reemplaza entero. Mezclar chunks de dos builds deja
      # manifiestos y módulos inconsistentes: la app arranca, falla al cargar
      # un módulo y entra en un bucle de reinicios.
      - name: Reemplazar build (.next)
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:max-retries 5
          set net:timeout 30
          set net:reconnect-interval-base 3
          set mirror:parallel-transfer-count 2
          rm -rf "$REMOTE_DIR/.next"
          mirror -R --no-perms --verbose ./deploy/.next "$REMOTE_DIR/.next"
          # Segunda pasada solo para los alias de paquetes externos: son
          # críticos (Prisma, better-sqlite3, sharp) y el FTP puede omitir
          # archivos en rutas largas cuando la conexión va lenta.
          mirror -R --no-perms --verbose ./deploy/.next/node_modules "$REMOTE_DIR/.next/node_modules"
          bye
          EOF

      # Comprueba que el build remoto es exactamente el que se compiló:
      # mismo BUILD_ID, mismos archivos de servidor y misma versión de Next.
      - name: Verificar integridad del build
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          local_build=$(tr -d '\r\n' < deploy/.next/BUILD_ID)
          local_static=$(find deploy/.next/static -type f | wc -l)
          local_server=$(find deploy/.next/server -type f | wc -l)
          local_next=$(node -p "require('./deploy/node_modules/next/package.json').version")

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          get "$REMOTE_DIR/.next/BUILD_ID" -o remote-build-id.txt
          get "$REMOTE_DIR/node_modules/next/package.json" -o remote-next-package.json
          bye
          EOF

          remote_build=$(tr -d '\r\n' < remote-build-id.txt)
          remote_next=$(node -p "require('./remote-next-package.json').version")

          remote_static=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF | wc -l
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          find "$REMOTE_DIR/.next/static"
          bye
          EOF
          )

          remote_server=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF | wc -l
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          find "$REMOTE_DIR/.next/server"
          bye
          EOF
          )

          local_aliases=$(find deploy/.next/node_modules -mindepth 1 -maxdepth 2 -type d 2>/dev/null | wc -l)
          remote_aliases=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF | wc -l || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          find "$REMOTE_DIR/.next/node_modules"
          bye
          EOF
          )

          remote_alias_list=$(lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          find "$REMOTE_DIR/.next/node_modules"
          bye
          EOF
          )

          echo "BUILD_ID local: $local_build / remoto: $remote_build"
          echo "Next local: $local_next / remoto: $remote_next"
          echo "estáticos locales: $local_static / remotos: $remote_static"
          echo "archivos de servidor locales: $local_server / remotos: $remote_server"
          echo "alias de paquetes locales: $local_aliases / remotos: $remote_aliases"

          if [ "$remote_build" != "$local_build" ]; then
            echo "::error::El BUILD_ID remoto no coincide: el build subió incompleto o mezclado."
            exit 1
          fi

          if [ "$remote_next" != "$local_next" ]; then
            echo "::error::La versión de Next en el servidor ($remote_next) no coincide con la compilada ($local_next)."
            exit 1
          fi

          if [ "$remote_static" -lt "$local_static" ]; then
            echo "::error::Faltan archivos estáticos en el servidor ($local_static locales vs $remote_static remotos)."
            exit 1
          fi

          if [ "$remote_server" -lt "$local_server" ]; then
            echo "::error::Faltan archivos de servidor en el servidor ($local_server locales vs $remote_server remotos)."
            exit 1
          fi

          if [ "$local_aliases" -gt 0 ] && [ "$remote_aliases" -lt "$local_aliases" ]; then
            echo "::error::Faltan los alias de paquetes externos ($local_aliases locales vs $remote_aliases remotos)."
            exit 1
          fi

          # Cada alias materializado debe estar completo: sin su package.json,
          # Node no resuelve el paquete externo y la app no arranca.
          if [ -n "$remote_alias_list" ]; then
            missing_aliases=0
            while IFS= read -r alias_dir; do
              rel=${alias_dir#deploy/.next/node_modules/}

              if ! printf '%s\n' "$remote_alias_list" | grep -qE "(^|/)$rel$"; then
                echo "::error::Falta el alias .next/node_modules/$rel"
                missing_aliases=$((missing_aliases + 1))
              elif ! printf '%s\n' "$remote_alias_list" | grep -qE "(^|/)$rel/package.json$"; then
                echo "::error::El alias .next/node_modules/$rel no tiene package.json"
                missing_aliases=$((missing_aliases + 1))
              fi
            done < <(find deploy/.next/node_modules -mindepth 1 -maxdepth 2 -type d 2>/dev/null | while IFS= read -r dir; do
              [ -f "$dir/package.json" ] && printf '%s\n' "$dir"
            done | sort)

            if [ "$missing_aliases" -ne 0 ]; then
              exit 1
            fi
          else
            echo "::warning::No se pudo listar .next/node_modules por FTP; se omite la verificacion de alias."
          fi


      - name: Solicitar reinicio y verificar
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -euo pipefail

          token="$(date -u +%s)-${RANDOM}"
          printf '%s\n' "$token" > restart-request.txt

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          put restart-request.txt -o "$REMOTE_DIR/tmp/deploy-restart"
          bye
          EOF

          # El cron del hosting ejecuta scripts/deploy-watch.sh cada minuto.
          # Espera a que el vigia confirme el reinicio con el mismo token.
          restarted=0
          for i in $(seq 1 36); do
            rm -f deploy-done.txt
            if lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF2 > /dev/null 2>&1
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          get "$REMOTE_DIR/tmp/deploy-done" -o deploy-done.txt
          bye
          EOF2
            then
              if [ -f deploy-done.txt ] && [ "$(tr -d '\r\n' < deploy-done.txt)" = "$token" ]; then
                restarted=1
                break
              fi
            fi
            sleep 10
          done

          if [ "$restarted" != "1" ]; then
            echo "::error::La app no confirmo el reinicio. Revisa que el cron de deploy-watch.sh este instalado."
            exit 1
          fi

          home=$(curl -fsS --max-time 20 https://podzcash.online/)
          if ! printf '%s' "$home" | grep -q "Escucha a quien"; then
            echo "::error::El inicio no muestra el contenido nuevo."
            exit 1
          fi

          echo "Sitio verificado"
