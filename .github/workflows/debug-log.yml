name: Diagnostico produccion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Descargar log del servidor
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -uo pipefail

          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" <<EOF
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          cls -1 "$REMOTE_DIR" > remote-listing.txt || true
          find "$REMOTE_DIR" -maxdepth 2 -name "*.log" > remote-logs.txt || true
          get "$REMOTE_DIR/stderr.log" -o stderr.log || true
          bye
          EOF

          echo "=== archivos en la raiz remota ==="
          cat remote-listing.txt || true
          echo "=== logs encontrados ==="
          cat remote-logs.txt || true

          if [ -f stderr.log ]; then
            echo "=== stderr.log: $(wc -c < stderr.log) bytes ==="
            echo "=== ultimas lineas sin ruido de fork ==="
            grep -vE "fork: (retry: )?Resource temporarily unavailable" stderr.log \
              | tail -n 120 \
              | sed -E 's/[A-Za-z0-9+/=_-]{40,}/[redactado]/g'
            echo "=== errores clave ==="
            grep -nE "Cannot find|EAGAIN|ENOMEM|out of memory|SQLITE|Prisma|Segmentation|FATAL|Unhandled|started server|Ready|Listening|Error:" stderr.log \
              | head -n 80 \
              | sed -E 's/[A-Za-z0-9+/=_-]{40,}/[redactado]/g'
          else
            echo "No se pudo descargar stderr.log"
          fi
